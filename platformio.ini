; ----------------------------------------------------------------------------
; claude-desktop-buddy — Xteink firmware (X4, X3, X4 Pro). FreeInk SDK
; (e-paper), vendored as the freeink-sdk git submodule at the project root
; (see .gitmodules; `git submodule update --init` before building). See
; README.md "Multi-board support" for the capability matrix and "Menu
; system"/"Input mapping" for what's real vs. substituted per board.
; ----------------------------------------------------------------------------

; --- env:xteink — X4 + X3, one ESP32-C3 binary --------------------------
; Mirrors freeink-sdk's own platformio.sample.ini [env:xteink] pattern: both
; device profiles compile into one binary, and freeink::selectXteinkDevice()
; (main.cpp's setup(), before display/SD bring-up) I2C-fingerprints which
; board is actually running and switches BoardConfig::ACTIVE + the display
; driver at runtime. One firmware.bin flashes either board.
[env:xteink]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
; esp32-c3-devkitm-1's stock partition table targets its 4MB default flash
; (a ~1.3MB app slot) — too small for this firmware; X4/X3 are real 16MB
; parts (see platformio.sample.ini), so use the matching scheme.
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Single framebuffer (controller RAM holds the previous frame) — same
    ; default freeink-sdk's own sample env uses for the C3's tight RAM.
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_DEVICE_X3=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    ; SD-backed character packs (see README "SD-backed character packs").
    ; X4/X3 use plain SPI/SdFat (FREEINK_SD_SDMMC excludes them — only
    ; de-link/X4Pro/PaperMono/MurphyM4 need the native SDMMC block device),
    ; so no USE_BLOCK_DEVICE_INTERFACE flag is needed here. SdFat itself is
    ; pulled in automatically as SDCardManager's own dependency.
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    ; PowerManager::deepSleepUntilPowerButton() backs the menu's "turn off" —
    ; neither board has a PMIC hard-off (the M5-era original's
    ; M5.Axp.PowerOff()), so real ESP32 deep sleep woken by the POWER button
    ; is the equivalent off state.
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; freeink::selectXteinkDevice() — the X3-vs-X4 runtime fingerprint above.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    ; Real hardware main.cpp uses when present (X3: QMI8658 IMU for shake,
    ; DS3231 RTC for the clock face) and no-ops elsewhere (X4 has neither —
    ; BoardConfig::hasImu()/hasRtc() gate every call site). Also needed on
    ; X4 Pro (touch's RTC, BM8563) — kept in this shared lib_deps list
    ; rather than duplicated per env.
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; Inert on X3/X4 (neither has a frontlight; FrontlightManager::present()
    ; is false and every call is a no-op) — linked here only so main.cpp,
    ; shared across all three boards, doesn't need per-env #ifdefs just to
    ; construct one.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:xteink_x4pro — X4 Pro, ESP32-S3 -----------------------------------
; A different MCU family from X4/X3 (ESP32-S3, not C3) — can't share the
; env above (BoardConfig rejects mixing MCU families at compile time), so
; this is a separate build, same main.cpp. GT911 touch, dual warm/cold
; frontlight, BM8563 RTC, and CW2017 battery gauge all auto-enable from
; -DFREEINK_DEVICE_X4PRO=1 (FREEINK_CAP_TOUCH/FREEINK_CAP_FRONTLIGHT/
; FREEINK_CAP_RTC) — see freeink-sdk/docs/xteink-x4pro-support.md for the
; hardware bring-up this profile is built from. Board input is
; InputStyle::DigitalButtons (no ADC ladder), so main.cpp's popPress()-based
; button handling covers only POWER on this board's physical buttons; CONFIRM
; comes from a synthesized touch tap and BACK from the capacitive Home key
; (input.wasHomeKeyTapped() — see README "Multi-board support").
[env:xteink_x4pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; Same reasoning as env:xteink above — X4 Pro is a real 16MB part; the
; generic esp32-s3-devkitc1-n16r8 board definition's own partition table is
; sized for a smaller app slot than this firmware needs, and we don't need
; the OEM's dual-OTA scheme (freeink-sdk/docs/xteink-x4pro-support.md
; "Partitions") since this isn't an OTA-updated build.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_X4PRO=1
    -DCORE_DEBUG_LEVEL=0
    ; Native 1-bit SDMMC, not shared SPI — required by SDCardManager for
    ; this board (freeink-sdk/docs/xteink-x4pro-support.md "Storage").
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; XteinkDetect's helpers are documented no-ops on non-Xteink-C3 profiles
    ; (its I2C fingerprint is C3-pinout-specific and unsafe on S3 — see
    ; XteinkDetect.h), so main.cpp's unconditional selectXteinkDevice() call
    ; still needs this linked even though it never does anything here.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:murphy — Murphy M3, ESP32-S3 --------------------------------------
; A third MCU family binary (ESP32-S3, same family as X4 Pro but a distinct
; board — BoardConfig rejects mixing MCU families, and Murphy M3 isn't part
; of the X4/X4 Pro dual-select scheme either way). UC8253 controller, CHSC6x
; touch, PWM frontlight, ADC battery — see freeink-sdk/libs/hardware/
; BoardConfig/include/BoardConfig.h MURPHY_M3 (~line 981) for the pin-level
; profile this binary switches on via -DFREEINK_DEVICE_MURPHY=1.
; CAP_TOUCH/CAP_FRONTLIGHT auto-enable from that flag (BoardConfig.h
; FREEINK_CAP_TOUCH/FREEINK_CAP_FRONTLIGHT, ~lines 176-183), same as
; freeink-sdk/platformio.sample.ini's own [env:murphy] reference env.
; Panel: the UC8253 controller is wired to a 240x416 portrait panel, but
; MURPHY_M3.displayWidth/Height are 416/240 (BoardConfig.h:988-989) — the
; Murphy driver rotates each plane into controller RAM, so this firmware
; (and display.getDisplayWidth()/Height()) sees a 416x240 landscape panel.
; sd: MURPHY_M3.sdmmc is NO_SDMMC (BoardConfig.h:1006, busWidth 0), so SD
; goes over plain SPI/SdFat like env:xteink above — no
; USE_BLOCK_DEVICE_INTERFACE flag needed here (contrast env:xteink_x4pro's
; native SDMMC, which does need it).
[env:murphy]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
; Same reasoning as env:xteink/env:xteink_x4pro above — the generic
; esp32-s3-devkitc1-n16r8 board definition's own partition table is sized
; for a smaller app slot than this firmware needs.
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_MURPHY=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; selectXteinkDevice()'s I2C fingerprint is C3-pinout-specific and unsafe
    ; on S3 (documented no-op there — see XteinkDetect.h); still linked
    ; because main.cpp's setup() calls it unconditionally on every board.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:papers3 — M5Stack PaperS3, ESP32-S3, GT911 touch-only input ---------
; A third ESP32-S3 device (its own binary, same main.cpp as env:xteink_x4pro
; above). Same 960x540 16-gray ED047TC1 glass as the classic ESP32 M5Paper
; v1.1, but no IT8951 timing controller: the S3 drives the panel directly
; over an 8-bit parallel bus via LovyanGFX (FREEINK_DRIVER_LGFX_EPD, bundled
; in m5stack/M5GFX), the same display class freeink-sdk's LilyGo T5 S3
; profile uses — see freeink-sdk/libs/hardware/BoardConfig/include/
; BoardConfig.h:1230-1293. Unlike LilyGo there is no PMIC/expander: the
; BoardPaperS3 lib_dep below supplies the board's LgfxEpdConfig (real pins,
; no power hooks) automatically once -DFREEINK_DEVICE_PAPERS3=1 is set — no
; -DFREEINK_LGFX_EPD_CONFIG override needed (freeink-sdk/libs/display/
; FreeInkDisplay/src/driver/LgfxEpdDriver.cpp:331-336). CAP_TOUCH (GT911),
; CAP_RTC (BM8563), and CAP_BUZZER (LEDC, GPIO21) auto-enable from the device
; flag; SD is plain SPI/SdFat on its own dedicated pins (BoardConfig.h:1264),
; not shared with the display bus.
;
; INPUT: PaperS3 has NO firmware-readable buttons — the side button feeds a
; self-latching PMS150G power chip, not a GPIO (BoardConfig.h:1242-1246).
; touch.synthesizeConfirm is false and there is no capacitive Home key
; (touch.hasHomeKey defaults false), so main.cpp's usual popPress()/
; isPressed()/wasHomeKeyTapped() button dispatch is a no-op on this board;
; see the "PaperS3 touch-only navigation" block in src/main.cpp
; (handleTouchNav()) and docs/board-notes/papers3.md for the tap-zone layout
; this port maps instead.
;
; M5GFX hard-requires OPI PSRAM ("M5PaperS3 need OPI-PSRAM enabled") — hence
; qio_opi + BOARD_HAS_PSRAM below, matching freeink-sdk's own
; platformio.sample.ini [env:papers3].
[env:papers3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; Same reasoning as env:xteink/env:xteink_x4pro above — the generic
; esp32-s3-devkitc1-n16r8 board definition's stock partition table is sized
; for a smaller app slot than this firmware needs.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_PAPERS3=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; Documented no-op on non-Xteink-C3 profiles (see the env:xteink_x4pro
    ; comment above) — still needed because main.cpp's setup() calls
    ; freeink::selectXteinkDevice() unconditionally.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
    ; PaperS3-only: this board's LgfxEpdConfig (pins, no power hooks) and its
    ; real power-off (BoardPaperS3::powerOff(), a GPIO44 pulse — see
    ; powerOffSequence() in src/main.cpp).
    BoardPaperS3=symlink://freeink-sdk/libs/hardware/BoardPaperS3
    ; LovyanGFX, vendored by M5Stack — backs FREEINK_DRIVER_LGFX_EPD's
    ; Panel_EPD/Bus_EPD (the raw-parallel ED047TC1 driver). Version pinned to
    ; match freeink-sdk's own platformio.sample.ini [env:papers3].
    m5stack/M5GFX @ 0.2.20

; --- env:lilygo_t5s3 — LilyGo T5 S3, ESP32-S3 --------------------------------
; NO REFERENCE IMPLEMENTATION WAS RUN ON HARDWARE FOR THIS UNIT. See
; docs/board-notes/lilygo-t5s3.md before trusting this beyond "it compiles."
;
; A third MCU family binary (ESP32-S3, like X4 Pro, but its own env: the panel
; class is entirely different). The 4.7" ED047TC1 glass has no on-glass
; controller — FreeInk's LgfxEpdDriver drives it directly over the S3's
; parallel/i80 bus via LovyanGFX's Panel_EPD/Bus_EPD (bundled in m5stack/
; M5GFX), gated behind the derived FREEINK_DRIVER_LGFX_EPD flag (freeink-sdk/
; libs/hardware/BoardConfig/include/BoardConfig.h:156-160), so M5GFX links
; only on this env. The panel can't power up without the board's TPS65185
; PMIC + PCA9535 IO-expander sequence, which freeink-sdk supplies as a
; complete, board-owned LgfxEpdConfig — freeink-sdk/libs/hardware/BoardT5S3
; (LilyGoT5S3LgfxConfig.cpp, BoardT5S3.cpp/h, BoardT5S3Pins.h) is a real
; reference implementation shipped in this SDK checkout (see
; freeink-sdk/docs/lilygo-t5s3-support.md and the board note above for what
; that means and doesn't mean). BoardT5S3::begin() (called from main.cpp's
; setup(), guarded by #if FREEINK_DEVICE_LILYGO) brings up the shared I2C bus,
; configures the PCA9535, registers its user-button hook, and preps the SD
; SPI bus — see freeink-sdk/libs/hardware/BoardConfig/include/BoardConfig.h:
; 1119-1161 (BoardProfile::LILYGO_T5S3) for the pin/peripheral map this env's
; flags below select. GT911 touch, PWM backlight, the BQ27220/BQ25896 I2C
; fuel gauge, and the PCF8563 RTC all auto-enable from -DFREEINK_DEVICE_
; LILYGO=1 (FREEINK_CAP_TOUCH/FREEINK_CAP_FRONTLIGHT/FREEINK_BATTERY_I2C_
; GAUGE/FREEINK_CAP_RTC in BoardConfig.h). -DBOARD_HAS_PSRAM is required
; (not documented in freeink-sdk/platformio.sample.ini's commented-out
; template, which omits it) because LgfxEpdDriver.cpp's canvas + grayscale
; planes are allocated with heap_caps_malloc(..., MALLOC_CAP_SPIRAM) — dead
; on arrival without PSRAM enabled; matches every other PSRAM-dependent env
; in freeink-sdk's own sample.ini (m5paper_v11, papers3, papermono) and this
; repo's env:xteink_x4pro (same board=esp32-s3-devkitc1-n16r8 part).
;
; INPUTS: InputStyle::DigitalButtons, but this board has only ONE firmware
; button on a plain GPIO (BOOT, GPIO0 -> input.power) — the "real" user
; button lives behind the PCA9535 expander and is wired in through
; InputManager::setButtonHook() by BoardT5S3::begin() (-> BTN_DOWN). BACK
; comes from the GT911's capacitive home-key status bit
; (input.wasHomeKeyTapped(), already generic in main.cpp — see
; BoardConfig::LILYGO_T5_PRO_GT911's hasHomeKey=true, BoardConfig.h:702-704).
; CONFIRM/LEFT/RIGHT/UP have no physical GPIO on this board and this
; profile's TouchConfig.synthesizeConfirm is false (BoardConfig.h:703, same
; as every touch profile in this SDK checkout including X4 Pro's — see the
; board note), so tap does not synthesize CONFIRM. They are NOT mapped on
; this env; see the board note for the full breakdown.
[env:lilygo_t5s3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_LILYGO=1
    ; Redundant but harmless: LgfxEpdDriver.cpp's #if FREEINK_DEVICE_LILYGO branch
    ; (checked first) always calls lilygoT5S3LgfxConfig() directly and never reads
    ; this macro on this env — it only matters for a config picked purely via
    ; -DFREEINK_LGFX_EPD_CONFIG (no FREEINK_DEVICE_LILYGO/_PAPERS3 set). Kept
    ; because it names the same function and matches freeink-sdk's own commented
    ; [env:lilygo_t5s3] sample literally (platformio.sample.ini:152-161). See
    ; docs/board-notes/lilygo-t5s3.md for the full citation.
    -DFREEINK_LGFX_EPD_CONFIG=lilygoT5S3LgfxConfig
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; XteinkDetect's helpers are documented no-ops off the Xteink C3 pinout
    ; (see XteinkDetect.h) — kept linked only because main.cpp's
    ; selectXteinkDevice() call is unconditional across every env.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
    ; Board-support layer (outside the SDK's device-agnostic libs above): the
    ; PCA9535/TPS65185 power sequence + user-button hook. Provides
    ; freeink::lilygoT5S3LgfxConfig() (the -DFREEINK_LGFX_EPD_CONFIG target)
    ; and BoardT5S3::begin() (called from main.cpp setup()).
    BoardT5S3=symlink://freeink-sdk/libs/hardware/BoardT5S3
    ; LovyanGFX (bundled), pinned to the same version freeink-sdk's own
    ; sample.ini and papers3 env use for the sibling LgfxEpd driver.
    m5stack/M5GFX @ 0.2.20

; --- env:papercolor — M5Stack PaperColor, ESP32-S3, native ED2208 ------------
; Distinct name from env:m5paper — that name in freeink-sdk's own sample is
; this same board, but this repo reserves "m5paper" for the M5Paper v1.1 unit
; (classic ESP32, IT8951 — a different device entirely; see
; docs/board-notes/papercolor.md). Mirrors freeink-sdk/platformio.sample.ini's
; [env:m5paper] composition (board/mcu/flash/lib_deps) under this project's
; own build_flags style (env:xteink/env:xteink_x4pro above), staying on the
; native (non-official) ED2208 driver path — i.e. NOT setting
; -DFREEINK_M5_OFFICIAL=1, which would pull the M5Unified/M5GFX/M5PM1 vendor
; stack this project deliberately avoids (see freeink-sdk README "M5Stack
; PaperColor refresh behavior").
;
; The panel is natively 6-color (Spectra 6, ED2208 controller) but this
; firmware's rendering goes through FreeInkUI's DisplayTarget, which is
; 1-bit-only (Bayer-dithered monochrome — see FreeInkUIDisplayTarget.h). True
; color output is out of scope here; see docs/board-notes/papercolor.md.
[env:papercolor]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; qio / qio_opi, not env:xteink_x4pro's dio: matches freeink-sdk's own
; [env:m5paper] sample exactly for this board's flash+PSRAM strapping.
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
; Same reasoning as env:xteink/env:xteink_x4pro above — the generic
; esp32-s3-devkitc1-n16r8 board definition's stock partition table is sized
; for a smaller app slot than this firmware needs.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_M5=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; freeink::selectXteinkDevice() is unconditional in main.cpp's setup();
    ; XteinkDetect's helpers are documented no-ops on non-Xteink-C3 profiles
    ; (its I2C fingerprint is C3-pinout-specific and unsafe on S3 — see
    ; XteinkDetect.h), so this is linked but inert here, same as env:xteink_x4pro.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    ; PaperColor has neither IMU nor RTC (BoardConfig::hasImu()/hasRtc() gate
    ; every call site to a no-op) — linked only so main.cpp, shared across all
    ; boards, doesn't need a per-env #ifdef just to construct one.
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; NO_FRONTLIGHT on this board (BoardConfig.h M5STACK_PAPER_COLOR) —
    ; FrontlightManager::present() is false and every call is a no-op, same
    ; reasoning as env:xteink above.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
    ; freeink-sdk's own [env:m5paper] sample links this for PaperColor's two
    ; GRB LEDs (BoardConfig.h M5_PAPERCOLOR_LEDS). main.cpp does not drive
    ; them — out of scope here, see docs/board-notes/papercolor.md — but this
    ; keeps the build composition matching the SDK's own reference env.
    LedManager=symlink://freeink-sdk/libs/hardware/LedManager

; --- env:delink — de-link, ESP32-S3 ----------------------------------------
; A third MCU-family/profile pairing after xteink (C3) and xteink_x4pro (S3):
; same S3 family as X4 Pro, but its own device flag/profile (freeink-sdk
; BoardConfig.h Board::DeLink / DE_LINK, ~line 1084). SSD1677 800x480 panel
; (same driver as X4 — FREEINK_DRIVER_SSD1677 covers both), single-channel
; PWM frontlight (GPIO5, 20kHz/8-bit — BoardConfig.h ~line 1104), and no
; touch/RTC/IMU/battery-gauge/audio/LEDs (NO_TOUCH/NO_AUDIO/NO_LEDS/NO_GAUGE
; in the profile, ~lines 1101/1105/1106/1109). FREEINK_CAP_FRONTLIGHT
; auto-enables for this device (BoardConfig.h ~line 181), so main.cpp's
; existing FrontlightManager::present() gate picks up the "brightness"
; settings item automatically — no main.cpp change needed for this board.
[env:delink]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; Same reasoning as env:xteink_x4pro above — de-link is a real 16MB part
; (freeink-sdk/platformio.sample.ini [env:delink] uses this same board id),
; and the generic esp32-s3-devkitc1-n16r8 board definition's stock partition
; table is sized for a smaller app slot than this firmware needs.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_DELINK=1
    ; SD on de-link is native 4-bit SDMMC (BoardConfig.h DE_LINK.sdmmc,
    ; ~line 1108), not SPI — SdFat can't drive SDIO, so SDCardManager mounts
    ; an FsVolume on a native esp-idf SDMMC block device instead
    ; (FREEINK_SD_SDMMC auto-enables for this device, BoardConfig.h ~line
    ; 304). That needs SdFat's generic block-device interface enabled, same
    ; as env:xteink_x4pro above:
    -DUSE_BLOCK_DEVICE_INTERFACE=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; de-link has no ADC-ladder/C3 pinout to fingerprint; XteinkDetect's
    ; helpers are documented no-ops on non-Xteink-C3 profiles (see
    ; env:xteink_x4pro above), so this is linked only because main.cpp's
    ; unconditional selectXteinkDevice() call needs the symbol.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    ; de-link has neither (NO_SENSORS-equivalent: NO_TOUCH's RTC/IMU fields
    ; are unassigned) — linked only so main.cpp's unconditional
    ; imuBegin()/rtcBegin() calls have a symbol; BoardConfig::hasImu()/
    ; hasRtc() gate every call site to a no-op here.
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; de-link DOES have a real frontlight (GPIO5) — unlike xteink/xteink_x4pro
    ; above this is not inert here; FrontlightManager::present() is true and
    ; drives the "brightness" settings item.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:sticky — Sticky, ESP32-S3 (UNVERIFIED — Upcoming Device) ------------
; freeink-sdk's own supported-devices table marks Sticky "(Upcoming Device)"
; and its BoardConfig.h profile flags orientation, SD bus-sharing, and the PDM
; mic pins as "pending hardware validation" (freeink-sdk/libs/hardware/
; BoardConfig/include/BoardConfig.h:1304-1310) — no unit has run this
; firmware, unlike X4 Pro (recovered from a real OEM flash dump). Built from
; the SDK's documentation only, with an extra degree of speculation on top of
; that. See docs/board-notes/sticky.md before trusting anything here.
;
; 3.97" 800x480 SSD1677 EPD (BoardConfig.h:1295-1299, :1311-1322), GT911 touch
; on its own I2C bus (:1334-1342), PCF8563 RTC + LSM6DS3TR-C IMU + BQ27220
; gauge on a second I2C bus (:1348-1359) — CAP_TOUCH/CAP_RTC/CAP_IMU
; auto-enable from -DFREEINK_DEVICE_STICKY=1, and main.cpp's existing
; BoardConfig::hasRtc()/hasImu() runtime gates (added for X3) pick them up
; with no code changes. MicroSD shares the display's SPI bus, NOT SDMMC
; (:1300, :1322-1326, :1347 NO_SDMMC) — so, unlike X4 Pro/de-link/Paper Mono,
; this board still needs the SPI pre-claim X3/X4 use; see the generalized
; guard in main.cpp setup(). Buzzer (LEDC, GPIO48) and PDM mic are
; intentionally NOT wired up — this codebase has no audio/mic abstraction
; (dropped with M5 support earlier this session); out of scope here.
[env:sticky]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; Same reasoning as env:xteink_x4pro above — esp32-s3-devkitc1-n16r8 is a real
; 16MB/8MB-PSRAM part (matching the "R8" in Sticky's ESP32-S3R8), so use the
; matching partition scheme rather than the generic board definition's.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    ; n16r8 = 8 MB octal PSRAM (matches Sticky's ESP32-S3R8 per BoardConfig.h:1295).
    ; freeink-sdk's own platformio.sample.ini [env:sticky] omits this flag, but
    ; env:xteink_x4pro above (same board string, same PSRAM package) sets it —
    ; matching that precedent here rather than the sample's apparent oversight.
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_STICKY=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; XteinkDetect's helpers are documented no-ops on non-Xteink-C3 profiles
    ; (see env:xteink_x4pro above) — still linked because main.cpp's
    ; unconditional selectXteinkDevice() call needs it present.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:papermono — M5Stack Paper Mono, ESP32-S3 --------------------------
; A different board profile from X4/X4 Pro (Board::PaperMono, InputStyle::
; DigitalTwoButton) but the same MCU family/build shape as X4 Pro, so this
; env mirrors it: same main.cpp, same lib_deps set. -DFREEINK_DEVICE_
; PAPERMONO=1 auto-enables FREEINK_CAP_TOUCH/FRONTLIGHT/RTC/LED/MIC and
; FREEINK_SD_SDMMC (BoardConfig.h) for this profile's real FT6336 touch,
; PMIC-PWM frontlight, RX8130 RTC, PM1/IOE1 RGB LED, and native SDMMC card —
; see docs/board-notes/paper-mono.md for the hardware bring-up this profile
; is built from and the DigitalTwoButton input-coverage finding.
[env:papermono]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; Same reasoning as env:xteink_x4pro above — a real 16MB part, and this isn't
; an OTA-updated build so the OEM's dual-OTA scheme isn't needed.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    ; PaperMonoDriver batches its grayscale target planes in host RAM
    ; (freeink-sdk/platformio.sample.ini [env:papermono]) — needs PSRAM on.
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_PAPERMONO=1
    -DCORE_DEBUG_LEVEL=0
    ; Native 4-bit SDMMC (BoardConfig.h PAPER_MONO sdmmc field, busWidth=4),
    ; not shared SPI — required by SDCardManager for this board, same as
    ; env:xteink_x4pro's native 1-bit SDMMC.
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; Documented no-op on non-Xteink-C3 profiles (its I2C fingerprint is
    ; C3-pinout-specific) — linked because main.cpp's setup() unconditionally
    ; calls selectXteinkDevice(), same as env:xteink_x4pro.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    ; Real hardware on this board: RX8130 RTC (BoardConfig.h:971). No IMU
    ; (ImuType::None, same line) — Imu's calls all no-op via BoardConfig::
    ; hasImu().
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; Real PMIC-PWM frontlight (AW9967 driven off the M5PM1's GPIO3/PWM0,
    ; BoardConfig.h:929-932) — FrontlightManager::present() gates main.cpp's
    ; Settings > brightness item on at runtime, no board-specific code needed.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:m5paper_v11 — M5Paper v1.1, classic ESP32 -------------------------
; A third MCU family (ESP32-D0WDQ6, not C3 or S3) — always its own binary,
; same main.cpp. 540x960 16-gray ED047TC1 panel behind an IT8951E timing
; controller (FreeInk's own hand-rolled SPI driver, no extra libs — see
; freeink-sdk/platformio.sample.ini "M5Paper v1.1" and BoardConfig.h:
; 1163-1228). GT911 touch, GPIO35 ADC battery. Board input is
; InputStyle::DigitalButtons: the 3-position rotary wheel gives real
; UP/DOWN/CONFIRM (BoardConfig.h M5PAPER_V11 input pins up=37/down=39/
; confirm=38) plus POWER (shares GPIO38 with CONFIRM by design — only 3
; wheel inputs exist), so main.cpp's popPress()-based button handling
; covers all four. BACK/LEFT/RIGHT have no wheel GPIO, and this board's
; TouchConfig has synthesizeConfirm=false and hasHomeKey=false
; (BoardConfig.h:1214-1216) — unlike the X4 Pro's touch config, nothing at
; the SDK level synthesizes those from a tap, so BACK/LEFT/RIGHT are not
; reachable on this board yet. See docs/board-notes/m5paper-v11.md.
;
; Classic ESP32 defaults to the Bluedroid Bluetooth host stack (not NimBLE,
; which X3/X4/X4 Pro get on their C3/S3 cores) — src/ble_bridge.cpp branches
; on CONFIG_BLUEDROID_ENABLED/CONFIG_NIMBLE_ENABLED to cover both; see that
; file's header comment.
[env:m5paper_v11]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
board_build.mcu = esp32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = qio
; M5Paper is a real 16MB part (freeink-sdk platformio.sample.ini: "M5Paper is
; ESP32-D0WDQ6 + 8MB PSRAM / 16MB flash") — esp32dev's stock partition table
; targets a smaller default flash size, so use the same scheme the other
; envs use here. The table's offsets/sizes only depend on total flash size,
; not MCU family, so default_16MB.csv is exactly as appropriate here as it
; is for the C3/S3 envs above.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    ; Classic ESP32 has no native USB peripheral (no USB-OTG/HW-CDC-JTAG,
    ; unlike the C3/S3 envs above) — it talks to the host over UART0 through
    ; an onboard USB-UART bridge chip instead. ARDUINO_USB_MODE/
    ; ARDUINO_USB_CDC_ON_BOOT exist to select between that native-USB
    ; Serial's two personalities (arduino-esp32 cores/esp32/HardwareSerial.h
    ; "#if ARDUINO_USB_CDC_ON_BOOT" -> HWCDCSerial/USBSerial); defining them
    ; here fails the build ('HWCDCSerial' was not declared, verified by a
    ; clean build attempt) since this core doesn't compile that path in for
    ; a chip with no native-USB peripheral to back it. Leaving both unset
    ; falls through to the correct default for this board: Serial = Serial0
    ; (UART0).
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    ; M5Paper's 63KB landscape framebuffer won't fit in classic ESP32's
    ; ~300KB DRAM alongside the firmware/WiFi/IDF — FreeInk auto-enables
    ; FREEINK_FB_PSRAM (framebuffer allocated from the PSRAM heap) for this
    ; device (BoardConfig.h:295 FREEINK_FB_PSRAM), which needs PSRAM itself
    ; turned on via this flag (freeink-sdk README "PSRAM").
    -DBOARD_HAS_PSRAM
    -DFREEINK_DEVICE_M5PAPER=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    ; M5Paper's SD card shares the display's SPI bus (plain SPI/SdFat, not
    ; SDMMC — BoardConfig.h:1188), so no USE_BLOCK_DEVICE_INTERFACE flag.
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    ; holdPowerRails()/deepSleepUntilPowerButton() — M5Paper's GPIO2 power
    ; latch (see this env's header comment) is asserted through this lib.
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; XteinkDetect's I2C fingerprint is C3-pinout-specific and documented
    ; unsafe off that MCU (XteinkDetect.h) — a no-op here, but main.cpp's
    ; unconditional selectXteinkDevice() call still needs it linked.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; Inert on M5Paper (NO_FRONTLIGHT — BoardConfig.h:1217); linked only so
    ; main.cpp, shared across all boards, needs no per-env #ifdef to
    ; construct one.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
