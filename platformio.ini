; ----------------------------------------------------------------------------
; claude-desktop-buddy — Xteink firmware (X4, X3, X4 Pro). FreeInk SDK
; (e-paper), vendored as the freeink-sdk git submodule at the project root
; (see .gitmodules; `git submodule update --init` before building). See
; README.md "Multi-board support" for the capability matrix and "Menu
; system"/"Input mapping" for what's real vs. substituted per board.
; ----------------------------------------------------------------------------

; --- env:xteink — X4 + X3, one ESP32-C3 binary --------------------------
; Mirrors freeink-sdk's own platformio.sample.ini [env:xteink] pattern: both
; device profiles compile into one binary, and freeink::selectXteinkDevice()
; (main.cpp's setup(), before display/SD bring-up) I2C-fingerprints which
; board is actually running and switches BoardConfig::ACTIVE + the display
; driver at runtime. One firmware.bin flashes either board.
[env:xteink]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
; esp32-c3-devkitm-1's stock partition table targets its 4MB default flash
; (a ~1.3MB app slot) — too small for this firmware; X4/X3 are real 16MB
; parts (see platformio.sample.ini), so use the matching scheme.
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Single framebuffer (controller RAM holds the previous frame) — same
    ; default freeink-sdk's own sample env uses for the C3's tight RAM.
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_X4=1
    -DFREEINK_DEVICE_X3=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    ; SD-backed character packs (see README "SD-backed character packs").
    ; X4/X3 use plain SPI/SdFat (FREEINK_SD_SDMMC excludes them — only
    ; de-link/X4Pro/PaperMono/MurphyM4 need the native SDMMC block device),
    ; so no USE_BLOCK_DEVICE_INTERFACE flag is needed here. SdFat itself is
    ; pulled in automatically as SDCardManager's own dependency.
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    ; PowerManager::deepSleepUntilPowerButton() backs the menu's "turn off" —
    ; neither board has a PMIC hard-off (the M5-era original's
    ; M5.Axp.PowerOff()), so real ESP32 deep sleep woken by the POWER button
    ; is the equivalent off state.
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; freeink::selectXteinkDevice() — the X3-vs-X4 runtime fingerprint above.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    ; Real hardware main.cpp uses when present (X3: QMI8658 IMU for shake,
    ; DS3231 RTC for the clock face) and no-ops elsewhere (X4 has neither —
    ; BoardConfig::hasImu()/hasRtc() gate every call site). Also needed on
    ; X4 Pro (touch's RTC, BM8563) — kept in this shared lib_deps list
    ; rather than duplicated per env.
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; Inert on X3/X4 (neither has a frontlight; FrontlightManager::present()
    ; is false and every call is a no-op) — linked here only so main.cpp,
    ; shared across all three boards, doesn't need per-env #ifdefs just to
    ; construct one.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:xteink_x4pro — X4 Pro, ESP32-S3 -----------------------------------
; A different MCU family from X4/X3 (ESP32-S3, not C3) — can't share the
; env above (BoardConfig rejects mixing MCU families at compile time), so
; this is a separate build, same main.cpp. GT911 touch, dual warm/cold
; frontlight, BM8563 RTC, and CW2017 battery gauge all auto-enable from
; -DFREEINK_DEVICE_X4PRO=1 (FREEINK_CAP_TOUCH/FREEINK_CAP_FRONTLIGHT/
; FREEINK_CAP_RTC) — see freeink-sdk/docs/xteink-x4pro-support.md for the
; hardware bring-up this profile is built from. Board input is
; InputStyle::DigitalButtons (no ADC ladder), so main.cpp's popPress()-based
; button handling covers only POWER on this board's physical buttons; CONFIRM
; comes from a synthesized touch tap and BACK from the capacitive Home key
; (input.wasHomeKeyTapped() — see README "Multi-board support").
[env:xteink_x4pro]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; Same reasoning as env:xteink above — X4 Pro is a real 16MB part; the
; generic esp32-s3-devkitc1-n16r8 board definition's own partition table is
; sized for a smaller app slot than this firmware needs, and we don't need
; the OEM's dual-OTA scheme (freeink-sdk/docs/xteink-x4pro-support.md
; "Partitions") since this isn't an OTA-updated build.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_X4PRO=1
    -DCORE_DEBUG_LEVEL=0
    ; Native 1-bit SDMMC, not shared SPI — required by SDCardManager for
    ; this board (freeink-sdk/docs/xteink-x4pro-support.md "Storage").
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; XteinkDetect's helpers are documented no-ops on non-Xteink-C3 profiles
    ; (its I2C fingerprint is C3-pinout-specific and unsafe on S3 — see
    ; XteinkDetect.h), so main.cpp's unconditional selectXteinkDevice() call
    ; still needs this linked even though it never does anything here.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager

; --- env:papermono — M5Stack Paper Mono, ESP32-S3 --------------------------
; A different board profile from X4/X4 Pro (Board::PaperMono, InputStyle::
; DigitalTwoButton) but the same MCU family/build shape as X4 Pro, so this
; env mirrors it: same main.cpp, same lib_deps set. -DFREEINK_DEVICE_
; PAPERMONO=1 auto-enables FREEINK_CAP_TOUCH/FRONTLIGHT/RTC/LED/MIC and
; FREEINK_SD_SDMMC (BoardConfig.h) for this profile's real FT6336 touch,
; PMIC-PWM frontlight, RX8130 RTC, PM1/IOE1 RGB LED, and native SDMMC card —
; see docs/board-notes/paper-mono.md for the hardware bring-up this profile
; is built from and the DigitalTwoButton input-coverage finding.
[env:papermono]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
; Same reasoning as env:xteink_x4pro above — a real 16MB part, and this isn't
; an OTA-updated build so the OEM's dual-OTA scheme isn't needed.
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    ; PaperMonoDriver batches its grayscale target planes in host RAM
    ; (freeink-sdk/platformio.sample.ini [env:papermono]) — needs PSRAM on.
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_PAPERMONO=1
    -DCORE_DEBUG_LEVEL=0
    ; Native 4-bit SDMMC (BoardConfig.h PAPER_MONO sdmmc field, busWidth=4),
    ; not shared SPI — required by SDCardManager for this board, same as
    ; env:xteink_x4pro's native 1-bit SDMMC.
    -DUSE_BLOCK_DEVICE_INTERFACE=1
build_src_filter = +<*>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
    SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
    PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
    ; Documented no-op on non-Xteink-C3 profiles (its I2C fingerprint is
    ; C3-pinout-specific) — linked because main.cpp's setup() unconditionally
    ; calls selectXteinkDevice(), same as env:xteink_x4pro.
    XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
    ; Real hardware on this board: RX8130 RTC (BoardConfig.h:971). No IMU
    ; (ImuType::None, same line) — Imu's calls all no-op via BoardConfig::
    ; hasImu().
    Imu=symlink://freeink-sdk/libs/hardware/Imu
    Rtc=symlink://freeink-sdk/libs/hardware/Rtc
    ; Real PMIC-PWM frontlight (AW9967 driven off the M5PM1's GPIO3/PWM0,
    ; BoardConfig.h:929-932) — FrontlightManager::present() gates main.cpp's
    ; Settings > brightness item on at runtime, no board-specific code needed.
    FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
