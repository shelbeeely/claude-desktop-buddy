[env:m5stickc-plus]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
board_build.partitions = no_ota.csv
board_build.f_cpu = 160000000L
build_flags =
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> +<buddies/> -<main_xteink_x4.cpp>
lib_deps =
    m5stack/M5StickCPlus
    bitbank2/AnimatedGIF @ ^2.1.1
    bblanchon/ArduinoJson @ ^7.0.0

; ----------------------------------------------------------------------------
; Xteink X4 port — FreeInk SDK (e-paper), vendored as the freeink-sdk git
; submodule at the project root (see .gitmodules; `git submodule update
; --init` before building this env). Mirrors freeink-sdk's own
; platformio.sample.ini [base] + [env:xteink_x4] pattern; see README.md
; "Xteink X4 port" for the sprite region / refresh timer / input-mapping
; decisions and every place this port diverges from the M5 build.
; ----------------------------------------------------------------------------
[env:xteink_x4]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
board_build.flash_size = 16MB
; esp32-c3-devkitm-1's stock partition table targets its 4MB default flash
; (a ~1.3MB app slot) — too small for this firmware; the X4 is a real 16MB
; part (see platformio.sample.ini), so use the matching scheme.
board_build.partitions = default_16MB.csv
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++2a
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Single framebuffer (controller RAM holds the previous frame) — same
    ; default freeink-sdk's own sample env uses for the C3's tight RAM.
    -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
    -DFREEINK_DEVICE_X4=1
    -DCORE_DEBUG_LEVEL=0
    ; This board declines the BLE folder-push character install (no on-device
    ; GIF decoder/color LCD) in favor of the compiled-in Icon assets — see
    ; xfer.h and README "Divergences".
    -DBUDDY_SUPPORTS_CHAR_PUSH=0
; Only the display-agnostic BLE bridge + this port's own main file — none of
; the M5-specific main.cpp / buddy.cpp / character.cpp / buddies/*.
build_src_filter = -<*> +<ble_bridge.cpp> +<main_xteink_x4.cpp>
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
    BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
    EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
    InputManager=symlink://freeink-sdk/libs/hardware/InputManager
    BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
    FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
    Icons=symlink://freeink-sdk/libs/assets/Icons
