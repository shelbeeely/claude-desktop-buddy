name: Build & publish Xteink firmware

# Builds env:xteink (X4 + X3, one ESP32-C3 binary) and env:xteink_x4pro
# (ESP32-S3) — see platformio.ini and README.md "Multi-board support" — and,
# on pushes to main, publishes both as flashable images + one web installer
# to GitHub Pages via ESP Web Tools (https://esphome.github.io/esp-web-tools/,
# no local toolchain needed to flash a device, just Chrome or Edge over USB /
# Web Serial). The manifest carries both chip families in one "builds" array;
# ESP Web Tools auto-selects the entry matching whichever board is actually
# connected, so the page needs only one Install button for both.
#
# One-time manual step this workflow cannot do for you: in the repo's
# Settings -> Pages, set "Source" to "GitHub Actions". Until that's set,
# the deploy job below will fail with a clear error from actions/deploy-pages.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "characters/**"
      - "platformio.ini"
      - "freeink-sdk"
      - "site/**"
      - ".github/workflows/firmware.yml"
  pull_request:
    paths:
      - "src/**"
      - "characters/**"
      - "platformio.ini"
      - "freeink-sdk"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (with freeink-sdk submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO and esptool
        # Pinned >=5 for the `merge-bin` (hyphenated) subcommand this
        # workflow uses; older esptool spelled it `merge_bin`.
        run: pip install -U platformio "esptool>=5"

      - name: Build env:xteink (X4 + X3, ESP32-C3)
        run: pio run -e xteink

      - name: Merge env:xteink into one flashable image
        # Matches exactly what `pio run -e xteink -t upload` would write, at
        # the same offsets, just concatenated into a single file at 0x0 so a
        # browser flasher only has to write one blob instead of stitching
        # parts — see README.md "Flashing from the browser" for how these
        # offsets were confirmed (pio's own planned esptool invocation).
        run: |
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          mkdir -p site/firmware
          esptool --chip esp32c3 merge-bin \
            -o site/firmware/xteink.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0000  .pio/build/xteink/bootloader.bin \
            0x8000  .pio/build/xteink/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 .pio/build/xteink/firmware.bin

      - name: Build env:xteink_x4pro (X4 Pro, ESP32-S3)
        run: pio run -e xteink_x4pro

      - name: Merge env:xteink_x4pro into one flashable image
        # Same recipe as env:xteink above, different chip — the offsets
        # (0x0/0x8000/0xe000/0x10000) are identical between esp32c3 and
        # esp32s3 in this Arduino core; confirmed via `pio run -e
        # xteink_x4pro -t upload -v`'s own planned esptool invocation, not
        # assumed from the C3 build alone.
        run: |
          BOOT_APP0="$HOME/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin"
          esptool --chip esp32s3 merge-bin \
            -o site/firmware/xteink_x4pro.bin \
            --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0000  .pio/build/xteink_x4pro/bootloader.bin \
            0x8000  .pio/build/xteink_x4pro/partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 .pio/build/xteink_x4pro/firmware.bin

      - name: Write manifest.json (ESP Web Tools)
        run: |
          VERSION="$(date -u +%Y.%m.%d)-${GITHUB_SHA::7}"
          sed "s/__VERSION__/${VERSION}/" site/manifest.template.json > site/manifest.json
          rm site/manifest.template.json
          echo "firmware version: ${VERSION}"

      - name: Upload firmware as a build artifact (every push/PR)
        uses: actions/upload-artifact@v4
        with:
          name: xteink-firmware
          path: |
            site/firmware/xteink.bin
            site/firmware/xteink_x4pro.bin
            .pio/build/xteink/firmware.bin
            .pio/build/xteink/bootloader.bin
            .pio/build/xteink/partitions.bin
            .pio/build/xteink_x4pro/firmware.bin
            .pio/build/xteink_x4pro/bootloader.bin
            .pio/build/xteink_x4pro/partitions.bin

      - name: Upload Pages site (main branch only)
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
